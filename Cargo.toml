[package]
name = "onenote-cli"
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
description = "Read and capture Microsoft OneNote notes through its Windows desktop application"
license = "MIT"
repository = "https://github.com/rvben/onenote-cli"
homepage = "https://github.com/rvben/onenote-cli"
readme = "README.md"
keywords = ["onenote", "cli", "desktop", "com"]
categories = ["command-line-utilities"]

[[bin]]
name = "onenote"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
html2md = "0.2.15"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
roxmltree = "0.20"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.49.8"
