[package]
name = "onenote-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Read Microsoft OneNote through its Windows desktop application"
license = "MIT"
readme = "README.md"
keywords = ["onenote", "cli", "desktop", "com"]
categories = ["command-line-utilities"]

[[bin]]
name = "onenote"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
html2md = "0.2.15"
roxmltree = "0.20"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util"] }

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.49.8"
tempfile = "3"
